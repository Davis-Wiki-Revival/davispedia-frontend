name: Trigger Backend Deployment

on:
  push:
    branches:
      - main

jobs:
  trigger-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger backend deployment
        env:
          GH_TOKEN: ${{ secrets.BACKEND_DISPATCH_TOKEN }}
          FRONTEND_SHA: ${{ github.sha }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/Davis-Wiki-Revival/davispedia-backend/dispatches \
            -d "{
              \"event_type\": \"frontend-main-updated\",
              \"client_payload\": {
                \"frontend_sha\": \"${FRONTEND_SHA}\"
              }
            }"