<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Davispedia Frontend Playground</title>
    <script>
      // Mock global MediaWiki environment for local dev
      window.mw = {
        config: {
          get: (key) => {
            const mocks = {
              wgUserName: 'LocalTester',
              wgTitle: 'Cowlender',
              wgCanonicalSpecialPageName: 'Cowlender',
              wgCowlenderRestBaseUrl: '/rest.php/cowlender/v1',
              wgScriptPath: '',
            };
            return mocks[key] || null;
          }
        }
      };
    </script>
  </head>
  <body>
    <!-- Mock Vector 2022 header element to mount into -->
    <div style="background: #f8f9fa; padding: 12px; border-bottom: 1px solid #ccc; display: flex; justify-content: flex-end;">
      <div id="p-personal" class="vector-user-links"></div>
    </div>

    <main style="max-width: 1400px; margin: 40px auto; padding: 0 24px; font-family: sans-serif;">
      <h1>The Cowlender</h1>
      <p>Community events in Davis</p>
      <div id="cowlender-root" data-cowlender-api="/rest.php/cowlender/v1">
        Loading The Cowlender…
      </div>
    </main>

    <script type="module" src="/src/index.ts"></script>
    <script type="module" src="/src/cowlender/index.tsx"></script>
  </body>
</html>
